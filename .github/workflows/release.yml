name: Build releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version
        type: string
        default: '0.1.0'
        required: true
      products:
        description: Products to build
        type: choice
        options: [all, tools, games]
        default: all
      publish:
        description: Publish three private product releases after every platform passes
        type: boolean
        default: false
  push:
    branches: ['release/wii-menu-20261115']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  INPUT_TAG: release-inputs-20261115
  INPUT_ARCHIVE: wiillr-release-inputs-20261115.zip
  INPUT_SHA256: 11caa5c79b58c74303d7f8130f234f00016cda1148efd6efe30c8d2d79297075
  RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
  PRODUCTS: ${{ inputs.products || 'all' }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, name: windows-x86_64}
          - {os: ubuntu-24.04, name: linux-x86_64}
          - {os: macos-15, name: macos-arm64}
          - {os: macos-15-intel, name: macos-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3 mingw-w64-x86_64-fmt mingw-w64-x86_64-zlib
            mingw-w64-x86_64-xxhash
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfmt-dev libxxhash-dev zlib1g-dev patchelf \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libudev-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libxss-dev libxtst-dev libxv-dev libdecor-0-dev wayland-protocols
      - name: Locate licensed Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $versions = Get-ChildItem -LiteralPath "$installation/VC/Redist/MSVC" -Directory | Sort-Object Name -Descending
          $runtime = $versions | ForEach-Object { Join-Path $_.FullName 'x64/Microsoft.VC143.CRT' } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $runtime) { throw 'The Windows package needs the licensed VC143 x64 redistributable.' }
          "WIILLR_REDIST_DIR=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja fmt xxhash sdl3 zlib
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix zlib)" >> "$GITHUB_ENV"
      - name: Linux SDL3 3.4.14
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/SDL3.tar.gz" https://github.com/libsdl-org/SDL/releases/download/release-3.4.14/SDL3-3.4.14.tar.gz
          echo "30d4aa2b3037718142b32dffd4e72f917ebb6cc5227150e7bb9c45efb2153aeb  $RUNNER_TEMP/SDL3.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/SDL3.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3-3.4.14" -B "$RUNNER_TEMP/sdl-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_STATIC=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdk"
          cmake --build "$RUNNER_TEMP/sdl-build" --parallel 2
          cmake --install "$RUNNER_TEMP/sdl-build"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Download frozen private build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$INPUT_ARCHIVE" --dir "$RUNNER_TEMP"
          python tools/release_inputs.py "$RUNNER_TEMP/$INPUT_ARCHIVE" "$RUNNER_TEMP/wiillr-inputs" --sha256 "$INPUT_SHA256"
      - name: Build and verify Windows packages
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          WIILLR_WAD_COMMON_KEY: ${{ secrets.WIILLR_WAD_COMMON_KEY }}
          WIILLR_CI_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          export CMAKE_PREFIX_PATH="$(cygpath -m /mingw64)"
          "$WIILLR_CI_PYTHON" -m pip install -r tools/requirements-inputs.txt
          "$WIILLR_CI_PYTHON" tools/ci_release.py --version "$RELEASE_VERSION" --products "$PRODUCTS" --inputs-dir "$RUNNER_TEMP/wiillr-inputs" --build-dir "$RUNNER_TEMP/wiillr-build" --output-dir "$GITHUB_WORKSPACE/dist" --jobs 2
      - name: Build and verify Linux and macOS packages
        if: runner.os != 'Windows'
        env:
          WIILLR_WAD_COMMON_KEY: ${{ secrets.WIILLR_WAD_COMMON_KEY }}
        run: |
          python -m pip install -r tools/requirements-inputs.txt
          python tools/ci_release.py --version "$RELEASE_VERSION" --products "$PRODUCTS" --inputs-dir "$RUNNER_TEMP/wiillr-inputs" --build-dir "$RUNNER_TEMP/wiillr-build" --output-dir "$GITHUB_WORKSPACE/dist" --jobs 2
      - name: Retain build and package identity
        if: always()
        run: |
          python -c "import json,pathlib; p=pathlib.Path('dist'); p.mkdir(exist_ok=True); (p/'source-${{ matrix.name }}.json').write_text(json.dumps({'commit':'${{ github.sha }}','platform':'${{ matrix.name }}','input_sha256':'${{ env.INPUT_SHA256 }}'},indent=2)+'\n')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.products == 'all'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish separate private releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for specification in 'wii-menu:WiiMenuRecomp:Wii Menu Recomp' 'mega-man-9:MegaMan9Recomp:Mega Man 9 Recomp' 'wiillr:wiillr:wiillr developer tools'; do
            IFS=: read -r product prefix title <<< "$specification"
            printf '%s\n\n%s\n\n%s\n' "$title $RELEASE_VERSION" \
              'Windows gameplay and owner review use the qualified native provider. Linux and macOS packages have platform build, dependency and tool smoke checks; gameplay and hardware performance there require separate qualification.' \
              "Setup and build instructions: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/${product/wiillr/developer-tools}.md" > release-notes.txt
            gh release create "$product-v$RELEASE_VERSION" dist/"$prefix"-* dist/SHA256SUMS-* dist/source-* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title $RELEASE_VERSION" --notes-file release-notes.txt --latest=false
          done
